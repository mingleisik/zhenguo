name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  # Windows runner 的 stdout 不是 UTF-8，构建脚本的注解和子进程输出含中文时会抛
  # UnicodeEncodeError 并让整个步骤以退出码 1 结束，所以统一固定 Python 的输出编码。
  PYTHONIOENCODING: utf-8

jobs:
  # 检查不阻断出包；测试按 2026-09-21 约定暂停，结果仅供参考。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  # Flutter 3.32.8 的 visual_studio.dart 只把 Visual Studio 主版本 17（VS 2022）映射到
  # CMake 生成器 "Visual Studio 17 2022"，其它版本一律回退成 "Visual Studio 16 2019"，
  # 而 windows-latest 现在是 Windows Server 2025 + VS 2026（主版本 18），生成器找不到
  # VS 2019，构建会以 "Unable to generate build files" 结束。windows-2022 仍在正常发版，
  # 自带 VS 2022，所以显式钉住基底，等 Flutter 支持 VS 2026 再放开。
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Add MinGW-w64 to PATH
        shell: pwsh
        run: echo 'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+/-/')
          TAG="v$VERSION"
          gh release create "$TAG" dist/windows/* \
            --title "真果鉴/红果鉴 $TAG" \
            --notes "Windows x64 便携版与 Linux amd64 deb。" \
            || gh release upload "$TAG" dist/windows/* --clobber

  # 目标系统是 Ubuntu 26.04，必须显式钉住基底：ubuntu-latest 目前仍是 24.04，
  # 会在 2026 年 10 月 19 日至 11 月 19 日之间切到 26.04，届时出包环境会漂移。
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libepoxy-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: python scripts/build_linux.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-linux
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+/-/')
          TAG="v$VERSION"
          gh release create "$TAG" dist/linux/* \
            --title "真果鉴/红果鉴 $TAG" \
            --notes "Windows x64 便携版与 Linux amd64 deb。" \
            || gh release upload "$TAG" dist/linux/* --clobber
